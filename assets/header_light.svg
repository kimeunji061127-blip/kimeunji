  <path class="tw" style="animation-delay:0.0s" transform="translate(210 70) scale(1.0)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z" fill="#FFFFFF"/><path class="tw" style="animation-delay:0.6s" transform="translate(980 96) scale(1.2)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z" fill="#FFFFFF"/><path class="tw" style="animation-delay:1.2s" transform="translate(1090 44) scale(0.8)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z" fill="#FFFFFF"/><path class="tw" style="animation-delay:1.8s" transform="translate(120 150) scale(0.7)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z" fill="#FFFFFF"/><path class="tw" style="animation-delay:2.4s" transform="translate(860 40) scale(0.9)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z" fill="#FFFFFF"/>
  <g class="rise">
    <text class="title" x="600" y="128" text-anchor="middle" fill="url(#tg)" stroke="#5D4037" stroke-width="10" paint-order="stroke" stroke-linejoin="round">kimeunji</text>
  </g>
  <g clip-path="url(#typing)">
    <rect x="248" y="152" width="704" height="44" rx="22" fill="#FFFFFF" opacity="0.75"/>
    <text class="sub" x="600" y="183" text-anchor="middle" fill="#4E342E">꿈과 희망이 둥둥 떠다니는 git repository</text>
